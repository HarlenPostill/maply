# maply: the database and the app, both on 127.0.0.1 only.
# Job folders (photos, prompts, Codex logs) live in ./data on your Mac.
name: maply

services:
  db:
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.4}
    environment:
      POSTGRES_USER: maply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maply}
      POSTGRES_DB: maply
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maply -d maply"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: maply-app:local
    stop_grace_period: 150s
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://maply:${POSTGRES_PASSWORD:-maply}@db:5432/maply
      DATA_DIR: /data
      # Prompts must contain paths Codex can use on your Mac, not container paths.
      HOST_DATA_DIR: ${PWD:-.}/data
      STREETS_FILE: /data/osm/city_of_sydney_streets.geojson
      SCOPE_GEOJSON_PATH: /app/config/city_of_sydney_approx.geojson
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 10"]
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

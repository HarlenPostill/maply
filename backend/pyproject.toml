[project]
name = "maply-backend"
version = "0.1.0"
description = "Local Street View collection and supervision tool for authorised accessibility research"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pillow>=10.4",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "openai>=1.60",
    "playwright==1.63.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: requires a PostgreSQL/PostGIS test database (TEST_DATABASE_URL)",
    "browser: requires Playwright Chromium",
    "live: touches a live external service; never run by default",
]
addopts = "-m 'not live'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "maply-atlas"
version = "0.1.0"
description = "Production street-accessibility database for Petal Path and wheelchair routing"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

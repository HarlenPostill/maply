name: Maply
options:
  bundleIdPrefix: com.harlenpostill
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: Z43R7TX7Z9
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Maply:
    type: application
    platform: iOS
    sources: [Maply, Shared]
    info:
      path: Maply/Info.plist
      properties:
        CFBundleDisplayName: Maply
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.harlenpostill.maply
            CFBundleURLSchemes: [maply]
    entitlements:
      path: Maply/Maply.entitlements
      properties:
        com.apple.security.application-groups: [group.com.harlenpostill.maply]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harlenpostill.maply
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: MaplyWidget
  MaplyWidget:
    type: app-extension
    platform: iOS
    sources: [MaplyWidget, Shared]
    info:
      path: MaplyWidget/Info.plist
      properties:
        CFBundleDisplayName: Maply
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: MaplyWidget/MaplyWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.harlenpostill.maply]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harlenpostill.maply.widget
        SKIP_INSTALL: YES
